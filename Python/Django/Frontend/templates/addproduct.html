<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <a href="/inventory/home">
        <button>Back</button>
    </a>
    <h1>Add product</h1>
    <form method="POST">
        {% csrf_token %}
            <label>productName</label>
            <input type="text" placeholder="enter the productName" name="name">
            <label>productPrice</label>
            <input type="number" placeholder="enter the productPrice" name="price">
            <label>productQty</label>
            <input type="number" placeholder="enter the productQty" name="qty">
            <br><br>
            <button type="submit">Add to cart</button>
    </form>
</body>
</html>
