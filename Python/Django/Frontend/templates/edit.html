<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Edit Product</h1>
    <form method="POST">
        {% csrf_token %}
        <label>productName</label>
        <input type="text" placeholder="enter the productName" name="name" value="{{prod.name}}">
        <label>productPrice</label>
        <input type="number" placeholder="enter the productPrice" name="price" value="{{prod.price}}">
        <label>productQty</label>
        <input type="number" placeholder="enter the productQty" name="qty" value="{{prod.qty}}">
        <br><br>
        <button type="submit">Update Product</button>
    </form>
</body>
</html>
