<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Product List</h1>
    {% for p in Products %}
        <h2>{{p.name}}</h2>
        <h2>{{p.price}}</h2>
        <h2>{{p.qty}}</h2>
        <hr>
        {% empty %}
            <p>No Produts found</p>
    {% endfor %}
</body>
</html>
